<script>window.TTE_BANCO = {"titulo":"Races","colunas":[{"campo":"size","titulo":"Size"},{"campo":"speed","titulo":"Speed","estreita":true}],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"hill-dwarf","nome":"Hill Dwarf","fonte":"FTC","icone":"races/hill-dwarf.svg","tipo":"Race · Compact","campos":{"size":"Compact","speed":"5 Zones"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Hill Dwarves live in the hills that lie between the plains and the mountains. Their settlements sit along the old trade routes, where caravans from the lowlands meet the mines and forges of the peaks. This position makes them natural middlemen: they guard the roads, trade with every people that passes through, and still travel up into the mountains to work the stone and ore. Generations of this life have made them practical, hardy, and sharp when it comes to the worth of things.\u003c/p>\n\u003cp>\u003cstrong>Description:\u003c/strong> Hill Dwarves are less stout than other dwarves, with a lighter, less dense build. Their beards and mustaches are of ordinary length, often kept neat for the sake of business. Their skin ranges from pale to tanned, and their hair and eyes come in a wide variety of colors.\u003c/p>\n\u003cp>\u003cstrong>Size:\u003c/strong> Compact\u003cbr>\u003cstrong>Speed:\u003c/strong> 5 Zones\u003cbr>\u003cstrong>Height:\u003c/strong> 1.20–1.50 m\u003cbr>\u003cstrong>Weight:\u003c/strong> 50–70 kg\u003cbr>\u003cstrong>Lifespan:\u003c/strong> They reach maturity at around 25 years old and live approximately 250–300 years.\u003cbr>\u003cstrong>Languages:\u003c/strong> \u003ca class=\"tag\" href=\"languages.html#common\" data-pop=\"language:common\">Common\u003c/a>, \u003ca class=\"tag\" href=\"languages.html#dwarvish\" data-pop=\"language:dwarvish\">Dwarvish\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/hill-toughness.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"H\">\u003cdiv>\u003cp>\u003cstrong>Hill Toughness.\u003c/strong> Your maximum Life increases by 2.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/trade-roads.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"T\">\u003cdiv>\u003cp>\u003cstrong>Trade Roads.\u003c/strong> You have Advantage on Tests to appraise the value of Items and to haggle over prices.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#hill-dwarf"}},{"id":"arcane-elf","nome":"Arcane Elf","fonte":"FTC","icone":"races/arcane-elf.svg","tipo":"Race · Standard","campos":{"size":"Standard","speed":"6 Zones"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Arcane Elves bend the mana of the universe to their will in every aspect of their lives. They weave it into their buildings, their tools, their clothing, and even into their own bodies. To an Arcane Elf, magic is not a discipline to be studied apart from daily life, but the material from which that life is built, and many of them can feel mana as easily as others feel the wind.\u003c/p>\n\u003cp>\u003cstrong>Description:\u003c/strong> Arcane Elves are tall and slender, with pale white skin. Their silky hair ranges from black to white, and their eyes are shades of purple or violet. Their veins carry a faint purple glow and are slightly more visible than other people&#39;s, as if mana flowed through them instead of blood.\u003c/p>\n\u003cp>\u003cstrong>Size:\u003c/strong> Standard\u003cbr>\u003cstrong>Speed:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Height:\u003c/strong> 1.70–1.80 m\u003cbr>\u003cstrong>Weight:\u003c/strong> 40–60 kg\u003cbr>\u003cstrong>Lifespan:\u003c/strong> They reach maturity at around 40 years old and usually live between 450–550 years.\u003cbr>\u003cstrong>Languages:\u003c/strong> \u003ca class=\"tag\" href=\"languages.html#common\" data-pop=\"language:common\">Common\u003c/a>, \u003ca class=\"tag\" href=\"languages.html#elvish\" data-pop=\"language:elvish\">Elvish\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/mana-sense.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"M\">\u003cdiv>\u003cp>\u003cstrong>Mana Sense.\u003c/strong> You sense the mana that flows through all things. You have \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:blindsight\">Blindsight\u003c/a> within 3 Zones.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/arcane-blood.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"A\">\u003cdiv>\u003cp>\u003cstrong>Arcane Blood.\u003c/strong> When you take damage from a Spell, you can use your Reaction to gain Resistance to that damage. You can use this feature twice per Rest.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#arcane-elf"}},{"id":"farmland-gnome","nome":"Farmland Gnome","fonte":"FTC","icone":"races/farmland-gnome.svg","tipo":"Race · Compact","campos":{"size":"Compact","speed":"5 Zones"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Farmland Gnomes are tireless workers who tend their crops and livestock. They wake before dawn and work until the sun goes down, and their villages are known for rich harvests and well-kept herds. They take pride in honest labor and in knowing every animal on their land by name, and they rarely sleep longer than they need to.\u003c/p>\n\u003cp>\u003cstrong>Description:\u003c/strong> Farmland Gnomes are small and sturdy, with slightly large noses. Their skin is tanned by the sun, their hair is dry and comes in shades of blond, black, and similar tones, and their eyes are blue, green, or amber.\u003c/p>\n\u003cp>\u003cstrong>Size:\u003c/strong> Compact\u003cbr>\u003cstrong>Speed:\u003c/strong> 5 Zones\u003cbr>\u003cstrong>Height:\u003c/strong> 0.80–1.25 m\u003cbr>\u003cstrong>Weight:\u003c/strong> 20–50 kg\u003cbr>\u003cstrong>Lifespan:\u003c/strong> They reach maturity at around 20 years old and usually live between 350–400 years.\u003cbr>\u003cstrong>Languages:\u003c/strong> \u003ca class=\"tag\" href=\"languages.html#common\" data-pop=\"language:common\">Common\u003c/a>, \u003ca class=\"tag\" href=\"languages.html#gnomish\" data-pop=\"language:gnomish\">Gnomish\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/early-riser.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"E\">\u003cdiv>\u003cp>\u003cstrong>Early Riser.\u003c/strong> Your Rest takes 6 hours instead of 8.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/way-with-animals.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"W\">\u003cdiv>\u003cp>\u003cstrong>Way with Animals.\u003c/strong> You have Advantage on Tests to calm, handle, or understand animals.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#farmland-gnome"}},{"id":"bretonic-human","nome":"Bretonic Human","fonte":"FTC","icone":"races/bretonic-human.svg","tipo":"Race · Standard","campos":{"size":"Standard","speed":"6 Zones"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Bretonic Humans are driven to conquer, to expand their territory, and to spread their culture, whatever means it takes. Their kingdoms grow through war, trade, diplomacy, and settlement alike, and few peoples have spread as far or as fast. This ambition makes them adaptable: wherever they go, they learn what they need to thrive there.\u003c/p>\n\u003cp>\u003cstrong>Description:\u003c/strong> Bretonic Humans have predominantly fair skin, and they vary widely in build, facial hair, eye color, and hair color.\u003c/p>\n\u003cp>\u003cstrong>Size:\u003c/strong> Standard\u003cbr>\u003cstrong>Speed:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Height:\u003c/strong> 1.60–1.85 m\u003cbr>\u003cstrong>Weight:\u003c/strong> 50–100 kg\u003cbr>\u003cstrong>Lifespan:\u003c/strong> They reach maturity at around 18 years old and usually live between 90–100 years.\u003cbr>\u003cstrong>Languages:\u003c/strong> \u003ca class=\"tag\" href=\"languages.html#bretonic\" data-pop=\"language:bretonic\">Bretonic\u003c/a>, \u003ca class=\"tag\" href=\"languages.html#common\" data-pop=\"language:common\">Common\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/driven-to-conquer.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Driven to Conquer.\u003c/strong> Once per Rest, you can give yourself Advantage on a Test or attack.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/adaptable.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"A\">\u003cdiv>\u003cp>\u003cstrong>Adaptable.\u003c/strong> You become Trained in one Skill of your choice.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#bretonic-human"}},{"id":"forest-orc","nome":"Forest Orc","fonte":"FTC","icone":"races/forest-orc.svg","tipo":"Race · Standard","campos":{"size":"Standard","speed":"6 Zones"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Forest Orcs live deep in dense forests, using the land itself for protection and isolation. They prefer to live among their own tribe, but they are neither hostile nor unfriendly toward outsiders, and travelers who respect the forest are often welcomed. Life among the trees has taught them to move quickly and quietly, to hunt by stealth, and to vanish into the undergrowth when danger comes.\u003c/p>\n\u003cp>\u003cstrong>Description:\u003c/strong> Forest Orcs have skin in shades of green and a lean build rather than a bulky, muscular one. Their hair is black and wavy or curly, and their eyes are yellow or amber.\u003c/p>\n\u003cp>\u003cstrong>Size:\u003c/strong> Standard\u003cbr>\u003cstrong>Speed:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Height:\u003c/strong> 1.70–2.00 m\u003cbr>\u003cstrong>Weight:\u003c/strong> 65–90 kg\u003cbr>\u003cstrong>Lifespan:\u003c/strong> They reach maturity at around 15 years old and usually live between 70–80 years.\u003cbr>\u003cstrong>Languages:\u003c/strong> \u003ca class=\"tag\" href=\"languages.html#orcish\" data-pop=\"language:orcish\">Orcish\u003c/a>, \u003ca class=\"tag\" href=\"languages.html#common\" data-pop=\"language:common\">Common\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/forest-stalker.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"F\">\u003cdiv>\u003cp>\u003cstrong>Forest Stalker.\u003c/strong> You have Advantage on \u003ca class=\"tag\" href=\"skills.html#stealth\" data-pop=\"skill:stealth\">Stealth\u003c/a> Tests in forests, and dense forest isn&#39;t Difficult Terrain for you.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/races/features/swift-runner.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"S\">\u003cdiv>\u003cp>\u003cstrong>Swift Runner.\u003c/strong> Once per combat, you can take the \u003ca class=\"tag\" href=\"actions.html#dash\" data-pop=\"action:dash\">Dash\u003c/a> action as a Minor Action.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#forest-orc"}}],"retrato":false};</script>
