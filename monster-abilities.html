<script>window.TTE_BANCO = {"titulo":"Monster Abilities","colunas":[{"campo":"category","titulo":"Category"},{"campo":"limit","titulo":"Limit"}],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"amphibious","nome":"Amphibious","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>It can breathe air and water.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"aura-damage-type","nome":"Aura (Damage Type)","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>A creature that starts its turn adjacent to it takes Weak damage of that type.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"flight","nome":"Flight","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>It can fly with its Speed.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"keen-senses","nome":"Keen Senses","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>It has Advantage on \u003ca class=\"tag\" href=\"skills.html#perception\" data-pop=\"skill:perception\">Perception\u003c/a> Tests.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"pack-tactics","nome":"Pack Tactics","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>Its attacks have Advantage against a creature adjacent to one of its allies.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"regeneration","nome":"Regeneration","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>At the start of its turn, it regains Weak Life. Choose a damage type: if it took damage of that type since its last turn, it doesn&#39;t regenerate.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"sunlight-weakness","nome":"Sunlight Weakness","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>In bright sunlight, its attacks and Tests have Disadvantage.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"undying","nome":"Undying","fonte":"ROC","icone":null,"tipo":"Monster Ability · Trait","campos":{"category":"Trait","limit":"—"},"html":"\u003cp>The first time each combat it would drop to 0 Life, it drops to 1 instead, unless the damage was \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> or a critical hit.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#traits"},"categoria":"Trait","limite":"—"},{"id":"breath","nome":"Breath","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action · Once per combat","campos":{"category":"Action","limit":"Once per combat"},"html":"\u003cp>A Cone of 3 Zones. Each creature in it makes an Agility Test. On a failure, it takes Medium damage of the monster&#39;s type.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"Once per combat"},{"id":"charge","nome":"Charge","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>If it moves at least 3 Zones in a straight line before attacking, the target must make a Strength Test or fall \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"drain","nome":"Drain","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>Make an attack. On a hit, it deals Medium damage and the monster regains Life equal to half the damage dealt.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"frightful-presence","nome":"Frightful Presence","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action · Once per combat","campos":{"category":"Action","limit":"Once per combat"},"html":"\u003cp>Each creature within 3 Zones that can see it makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a> until the end of its next turn.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"Once per combat"},{"id":"grab","nome":"Grab","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>Make an attack. On a hit, it deals Weak damage and the target becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a> until it uses its Main Action to make a Strength or Agility Test to escape.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"petrifying-gaze","nome":"Petrifying Gaze","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action · Once per combat","campos":{"category":"Action","limit":"Once per combat"},"html":"\u003cp>A creature within 6 Zones makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>. It repeats the Test at the end of each of its turns, ending the effect on a success.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"Once per combat"},{"id":"poison","nome":"Poison","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>When it hits with an attack, the target makes a Strength Test or takes Weak extra damage at the end of each of its turns, repeating the Test at the end of each turn.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"spellcasting","nome":"Spellcasting","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>It knows 2 Spells from \u003ca href=\"../livros/fragments-of-the-cosmos.html\">Fragments Of The Cosmos\u003c/a> and can Conjure each one twice per combat, without spending Mana, at its own tier.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"swallow","nome":"Swallow","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action","campos":{"category":"Action","limit":"—"},"html":"\u003cp>Make an attack against a creature at least one size smaller. On a hit, it deals Medium damage and the target is swallowed: it is \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>, can only attack the monster, and takes Weak damage at the start of each of its turns. It escapes if it deals damage equal to a quarter of the monster&#39;s maximum Life in one turn.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"—"},{"id":"web","nome":"Web","fonte":"ROC","icone":null,"tipo":"Monster Ability · Action · Once per combat","campos":{"category":"Action","limit":"Once per combat"},"html":"\u003cp>A Square of 2 Zones within 6 Zones. Each creature in it makes an Agility Test or becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>, repeating the Test at the end of each of its turns.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#actions"},"categoria":"Action","limite":"Once per combat"},{"id":"parry","nome":"Parry","fonte":"ROC","icone":null,"tipo":"Monster Ability · Reaction · Once per combat","campos":{"category":"Reaction","limit":"Once per combat"},"html":"\u003cp>When it&#39;s hit by a melee attack, it reduces the damage by half.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#reactions"},"categoria":"Reaction","limite":"Once per combat"},{"id":"retaliate","nome":"Retaliate","fonte":"ROC","icone":null,"tipo":"Monster Ability · Reaction","campos":{"category":"Reaction","limit":"—"},"html":"\u003cp>When a creature adjacent to it hits it with a melee attack, it makes an attack against that creature.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#reactions"},"categoria":"Reaction","limite":"—"},{"id":"spiteful-burst","nome":"Spiteful Burst","fonte":"ROC","icone":null,"tipo":"Monster Ability · Reaction","campos":{"category":"Reaction","limit":"—"},"html":"\u003cp>When it drops to 0 Life, each creature adjacent to it takes Weak damage of the monster&#39;s type.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#reactions"},"categoria":"Reaction","limite":"—"},{"id":"attack","nome":"Attack","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action","campos":{"category":"Boss Action","limit":"—"},"html":"\u003cp>It makes one attack.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"—"},{"id":"command","nome":"Command","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action","campos":{"category":"Boss Action","limit":"—"},"html":"\u003cp>An ally it can see moves up to its Speed or makes one attack, using its Reaction.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"—"},{"id":"move","nome":"Move","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action","campos":{"category":"Boss Action","limit":"—"},"html":"\u003cp>It moves up to half its Speed without provoking \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a>.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"—"},{"id":"roar","nome":"Roar","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action · Once per combat","campos":{"category":"Boss Action","limit":"Once per combat"},"html":"\u003cp>Each enemy within 3 Zones makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a> until the end of the Boss&#39;s next turn.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"Once per combat"},{"id":"shake-off","nome":"Shake Off","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action · 2 actions","campos":{"category":"Boss Action","limit":"2 actions"},"html":"\u003cp>It ends one Condition on itself.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"2 actions"},{"id":"signature","nome":"Signature","fonte":"ROC","icone":null,"tipo":"Monster Ability · Boss Action · 2 actions","campos":{"category":"Boss Action","limit":"2 actions"},"html":"\u003cp>It uses one of its abilities that isn&#39;t limited to once per combat.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#boss-actions"},"categoria":"Boss Action","limite":"2 actions"}],"retrato":false};</script>
