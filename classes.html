<script>window.TTE_BANCO = {"titulo":"Classes","colunas":[{"campo":"life","titulo":"Life"},{"campo":"resource","titulo":"Resource"}],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"archer","nome":"Archer","fonte":"FTC","icone":"classes/archer.svg","tipo":"Class","campos":{"life":"Medium","resource":""},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Archers are specialists in long-range weapons. They think in terms of positioning and safety, always looking for high ground, open lines of sight, and a safe distance from danger. Hunters, scouts, and soldiers alike take up the bow, and a good Archer can end a fight before the enemy ever reaches them. Even so, they still carry a blade, and they know how to use it when there&#39;s no other choice.\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> Choose 3 Skills.\u003cbr>\u003cstrong>Life:\u003c/strong> Medium.\u003c/p>\n\u003cp>\u003cstrong>Starting Equipment:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#adventurers-kit\" data-pop=\"item:adventurers-kit\">Adventurer&#39;s Kit\u003c/a>\u003c/li>\n\u003cli>d12 × 10 \u003ca class=\"tag\" href=\"items.html#aurel\" data-pop=\"item:aurel\">Aurel\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#leather\" data-pop=\"item:leather\">Leather Armor\u003c/a>\u003c/li>\n\u003cli>Choose 1:\u003cul>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#shortbow\" data-pop=\"item:shortbow\">Shortbow\u003c/a>, \u003ca class=\"tag\" href=\"items.html#arrows-20\" data-pop=\"item:arrows-20\">20 Arrows\u003c/a>, a \u003ca class=\"tag\" href=\"items.html#quiver\" data-pop=\"item:quiver\">Quiver\u003c/a>, and 1 \u003ca class=\"tag\" href=\"items.html#dagger\" data-pop=\"item:dagger\">Dagger\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#longbow\" data-pop=\"item:longbow\">Longbow\u003c/a> and \u003ca class=\"tag\" href=\"items.html#arrows-20\" data-pop=\"item:arrows-20\">20 Arrows\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#crossbow\" data-pop=\"item:crossbow\">Crossbow\u003c/a>, \u003ca class=\"tag\" href=\"items.html#bolts-20\" data-pop=\"item:bolts-20\">20 Bolts\u003c/a>, and a \u003ca class=\"tag\" href=\"items.html#quiver\" data-pop=\"item:quiver\">Quiver\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Last Resort\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Double Shot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Point Blank\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Eagle Eye\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Specialization:\u003c/strong> \u003ca class=\"tag\" href=\"specializations.html#deadshot\" data-pop=\"specialization:deadshot\">Deadshot\u003c/a>\u003c/p>\n\u003ch3>Class Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/last-resort.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"L\">\u003cdiv>\u003cp>\u003cstrong>Last Resort.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 1\u003c/span> When a creature within your Melee Reach attacks you, you can use your Reaction to make a melee Weapon attack against it. You can use this feature 1 &gt; 2 &gt; 3 &gt; 4 times per combat.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/double-shot.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Double Shot.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 4\u003c/span> Your \u003ca class=\"tag\" href=\"actions.html#secondary-attack\" data-pop=\"action:secondary-attack\">Secondary Attack\u003c/a> can be made with your ranged Weapon, dealing full damage.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/point-blank.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"P\">\u003cdiv>\u003cp>\u003cstrong>Point Blank.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 7\u003c/span> Your ranged attacks no longer have Disadvantage against targets within 1 Zone. In addition, if you haven&#39;t moved during your Turn, your ranged attacks have +1 to hit until the end of that Turn.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/eagle-eye.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"E\">\u003cdiv>\u003cp>\u003cstrong>Eagle Eye.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 10\u003c/span> Your ranged attacks no longer have Disadvantage when the target is beyond the first range of your Weapon, and they ignore Partial Cover.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#archer"}},{"id":"healer","nome":"Healer","fonte":"FTC","icone":"classes/healer.svg","tipo":"Caster Class","campos":{"life":"Medium","resource":"Mana (Caster)"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Healers go onto the battlefield to aid and support their allies, keeping them on their feet when the fighting is at its worst. Some are trained physicians, others are self-taught village menders or battlefield volunteers, but all of them share the same instinct: to run toward the wounded while everyone else runs away.\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> Choose 3 Skills.\u003cbr>\u003cstrong>Life:\u003c/strong> Medium.\u003cbr>\u003cstrong>Mana:\u003c/strong> Caster.\u003cbr>\u003cstrong>Conjuring Attribute:\u003c/strong> Intellect.\u003cbr>\u003cstrong>Spells:\u003c/strong> You learn 4 Healer Spells at levels 1, 4, 7, and 10.\u003c/p>\n\u003cp>\u003cstrong>Starting Equipment:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#adventurers-kit\" data-pop=\"item:adventurers-kit\">Adventurer&#39;s Kit\u003c/a>\u003c/li>\n\u003cli>d12 × 10 \u003ca class=\"tag\" href=\"items.html#aurel\" data-pop=\"item:aurel\">Aurel\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#hide\" data-pop=\"item:hide\">Hide Armor\u003c/a>\u003c/li>\n\u003cli>1 Weapon of your choice\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>First Aid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Mender&#39;s Step\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Potent Healing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Second Chance\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Specialization:\u003c/strong> \u003ca class=\"tag\" href=\"specializations.html#field-doctor\" data-pop=\"specialization:field-doctor\">Field Doctor\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Spell List:\u003c/strong> \u003ca class=\"tag\" href=\"spells.html#barrier\" data-pop=\"spell:barrier\">Barrier\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#cleanse\" data-pop=\"spell:cleanse\">Cleanse\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#concussive-bolt\" data-pop=\"spell:concussive-bolt\">Concussive Bolt\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#distant-mend\" data-pop=\"spell:distant-mend\">Distant Mend\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#elemental-ward\" data-pop=\"spell:elemental-ward\">Elemental Ward\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#healing-circle\" data-pop=\"spell:healing-circle\">Healing Circle\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#healing-pulse\" data-pop=\"spell:healing-pulse\">Healing Pulse\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#healing-touch\" data-pop=\"spell:healing-touch\">Healing Touch\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#inspire\" data-pop=\"spell:inspire\">Inspire\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#leaping-remedy\" data-pop=\"spell:leaping-remedy\">Leaping Remedy\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#life-link\" data-pop=\"spell:life-link\">Life Link\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#mana-lantern\" data-pop=\"spell:mana-lantern\">Mana Lantern\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#protective-ward\" data-pop=\"spell:protective-ward\">Protective Ward\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#quicken\" data-pop=\"spell:quicken\">Quicken\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#rejuvenation\" data-pop=\"spell:rejuvenation\">Rejuvenation\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#restore-vigor\" data-pop=\"spell:restore-vigor\">Restore Vigor\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#sanctuary\" data-pop=\"spell:sanctuary\">Sanctuary\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#soothe\" data-pop=\"spell:soothe\">Soothe\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#swift-mend\" data-pop=\"spell:swift-mend\">Swift Mend\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#withering-touch\" data-pop=\"spell:withering-touch\">Withering Touch\u003c/a>\u003c/p>\n\u003ch3>Class Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/first-aid.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"F\">\u003cdiv>\u003cp>\u003cstrong>First Aid.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 1\u003c/span> As a Minor Action, you touch a \u003ca class=\"tag\" href=\"conditions.html#fainted\" data-pop=\"condition:fainted\">Fainted\u003c/a> creature. It regains 1 Life. You can use this feature 1 &gt; 2 &gt; 3 &gt; 4 times per combat.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/menders-step.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"M\">\u003cdiv>\u003cp>\u003cstrong>Mender's Step.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 4\u003c/span> After you heal a creature, you can move up to 2 Zones without provoking \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a>.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/potent-healing.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"P\">\u003cdiv>\u003cp>\u003cstrong>Potent Healing.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 7\u003c/span> When you heal a creature with a Spell, add your Intellect to the amount healed.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/second-chance.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"S\">\u003cdiv>\u003cp>\u003cstrong>Second Chance.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 10\u003c/span> Once per Recover, when a creature within 6 Zones of you would gain a Wound, you can use your Reaction to prevent it. That creature also regains Medium (d12) Life.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#healer"}},{"id":"mage","nome":"Mage","fonte":"FTC","icone":"classes/mage.svg","tipo":"Caster Class","campos":{"life":"Fragile","resource":"Mana (Caster)"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Mages manipulate mana directly, without channeling or focusing it. Where other casters shape magic with care, a Mage tears it out of the world and hurls it, and the results are destructive and unrefined. Their magic is too wild to be held steady, so Mages can never Conjure Concentration Spells.\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> Choose 3 Skills.\u003cbr>\u003cstrong>Life:\u003c/strong> Fragile.\u003cbr>\u003cstrong>Mana:\u003c/strong> Caster.\u003cbr>\u003cstrong>Conjuring Attribute:\u003c/strong> Intellect.\u003cbr>\u003cstrong>Spells:\u003c/strong> You learn 4 Mage Spells at levels 1, 4, 7, and 10. You can&#39;t Conjure Concentration Spells.\u003c/p>\n\u003cp>\u003cstrong>Starting Equipment:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#adventurers-kit\" data-pop=\"item:adventurers-kit\">Adventurer&#39;s Kit\u003c/a>\u003c/li>\n\u003cli>d12 × 10 \u003ca class=\"tag\" href=\"items.html#aurel\" data-pop=\"item:aurel\">Aurel\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#robes\" data-pop=\"item:robes\">Robes\u003c/a>\u003c/li>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#dagger\" data-pop=\"item:dagger\">Dagger\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Overcharge\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Destructive Mind\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Blood Casting\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Cataclysm\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Specialization:\u003c/strong> \u003ca class=\"tag\" href=\"specializations.html#arcanist\" data-pop=\"specialization:arcanist\">Arcanist\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Spell List:\u003c/strong> \u003ca class=\"tag\" href=\"spells.html#arcane-bolt\" data-pop=\"spell:arcane-bolt\">Arcane Bolt\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#arcane-explosion\" data-pop=\"spell:arcane-explosion\">Arcane Explosion\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#arcane-fist\" data-pop=\"spell:arcane-fist\">Arcane Fist\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#arcane-nova\" data-pop=\"spell:arcane-nova\">Arcane Nova\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#arcane-torrent\" data-pop=\"spell:arcane-torrent\">Arcane Torrent\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#chain-lightning\" data-pop=\"spell:chain-lightning\">Chain Lightning\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#fire-explosion\" data-pop=\"spell:fire-explosion\">Fire Explosion\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#flamethrower\" data-pop=\"spell:flamethrower\">Flamethrower\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#flare\" data-pop=\"spell:flare\">Flare\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#force-break\" data-pop=\"spell:force-break\">Force Break\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#frost-nova\" data-pop=\"spell:frost-nova\">Frost Nova\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#frost-thrower\" data-pop=\"spell:frost-thrower\">Frost Thrower\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#ignite\" data-pop=\"spell:ignite\">Ignite\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#lightning-bolt\" data-pop=\"spell:lightning-bolt\">Lightning Bolt\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#mana-recoil\" data-pop=\"spell:mana-recoil\">Mana Recoil\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#mana-rupture\" data-pop=\"spell:mana-rupture\">Mana Rupture\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#scorching-touch\" data-pop=\"spell:scorching-touch\">Scorching Touch\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#shocking-grasp\" data-pop=\"spell:shocking-grasp\">Shocking Grasp\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#shockwave\" data-pop=\"spell:shockwave\">Shockwave\u003c/a>, \u003ca class=\"tag\" href=\"spells.html#thunderclap\" data-pop=\"spell:thunderclap\">Thunderclap\u003c/a>\u003c/p>\n\u003ch3>Class Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/overcharge.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"O\">\u003cdiv>\u003cp>\u003cstrong>Overcharge.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 1\u003c/span> When you Conjure a Spell that deals damage, you can raise its damage category by one. If you do, you take Weak (d4 &gt; d6 &gt; d8 &gt; d10) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage, which can&#39;t be reduced in any way.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/destructive-mind.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Destructive Mind.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 4\u003c/span> When you Conjure a Spell that deals damage, you can add your Intellect to the damage dealt to one of its targets. You can use this feature 1 &gt; 2 &gt; 3 times per combat.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/blood-casting.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"B\">\u003cdiv>\u003cp>\u003cstrong>Blood Casting.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 7\u003c/span> You can pay part or all of a Spell&#39;s MP cost with your Life instead, losing 2 Life for each MP you don&#39;t pay.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/cataclysm.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"C\">\u003cdiv>\u003cp>\u003cstrong>Cataclysm.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 10\u003c/span> Once per Recover, when you Conjure a Spell that deals damage, it deals the maximum possible damage. Afterwards, you become \u003ca class=\"tag\" href=\"conditions.html#stunned\" data-pop=\"condition:stunned\">Stunned\u003c/a> until the end of your next Turn.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#mage"}},{"id":"thief","nome":"Thief","fonte":"FTC","icone":"classes/thief.svg","tipo":"Class","campos":{"life":"Weak","resource":"Combo"},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Thieves are survivors of the cities, often turning to wrongdoing to feed themselves, to survive, and sometimes out of simple malice. They learn early that a fair fight is a fight you might lose, so they strike fast, chain their blows together, and disappear before anyone can strike back.\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> Choose 4 Skills.\u003cbr>\u003cstrong>Life:\u003c/strong> Weak.\u003cbr>\u003cstrong>Resource:\u003c/strong> Combo.\u003c/p>\n\u003cp>\u003cstrong>Starting Equipment:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#adventurers-kit\" data-pop=\"item:adventurers-kit\">Adventurer&#39;s Kit\u003c/a>\u003c/li>\n\u003cli>d12 × 10 \u003ca class=\"tag\" href=\"items.html#aurel\" data-pop=\"item:aurel\">Aurel\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#gambeson\" data-pop=\"item:gambeson\">Gambeson\u003c/a>\u003c/li>\n\u003cli>2 \u003ca class=\"tag\" href=\"items.html#dagger\" data-pop=\"item:dagger\">Daggers\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Combo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Escape Artist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Flow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Master Thief\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Specialization:\u003c/strong> \u003ca class=\"tag\" href=\"specializations.html#street-scoundrel\" data-pop=\"specialization:street-scoundrel\">Street Scoundrel\u003c/a>\u003c/p>\n\u003ch3>Class Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/combo.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"C\">\u003cdiv>\u003cp>\u003cstrong>Combo.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 1\u003c/span> Each time you hit a creature with an attack, you gain 1 Combo. You can hold up to 3 &gt; 4 &gt; 5 &gt; 6 Combo, and you lose all of your Combo at the end of the combat. You spend Combo on Finishers, which are features marked with a Combo cost. You start with one Finisher:\u003c/p>\u003cul>\n\u003cli>\u003cstrong>Eviscerate (Finisher — any amount of Combo):\u003c/strong> When you hit with an attack, you can spend any amount of Combo. The attack deals +2 damage for each Combo spent.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/escape-artist.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"E\">\u003cdiv>\u003cp>\u003cstrong>Escape Artist.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 4\u003c/span> You gain two Finishers:\u003c/p>\u003cul>\n\u003cli>\u003cstrong>Slip Away (Finisher — 1 Combo):\u003c/strong> As part of your movement, you take the \u003ca class=\"tag\" href=\"actions.html#disengage\" data-pop=\"action:disengage\">Disengage\u003c/a> action.\u003c/li>\n\u003cli>\u003cstrong>Vanish (Finisher — 2 Combo):\u003c/strong> As a Minor Action, you make a Test to \u003ca class=\"tag\" href=\"actions.html#hide\" data-pop=\"action:hide\">Hide\u003c/a>, even while you are being observed.\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/flow.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"F\">\u003cdiv>\u003cp>\u003cstrong>Flow.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 7\u003c/span> You start each combat with 1 Combo, and you gain 2 Combo instead of 1 when you score a Critical Hit.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/master-thief.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"M\">\u003cdiv>\u003cp>\u003cstrong>Master Thief.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 10 · Finisher — 3 Combo\u003c/span> Once per Turn, you take an additional Main Action. It can&#39;t be the \u003ca class=\"tag\" href=\"actions.html#attack\" data-pop=\"action:attack\">Attack\u003c/a> action.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#thief"}},{"id":"warrior","nome":"Warrior","fonte":"FTC","icone":"classes/warrior.svg","tipo":"Class","campos":{"life":"Strong","resource":""},"html":"\u003cp>\u003cstrong>Origin:\u003c/strong> Warriors are disciplined and trained in many combat techniques, learning to deal with every kind of enemy. Soldiers, mercenaries, knights, and pit fighters all walk this path, and no two Warriors fight quite alike: each one masters their own set of Techniques over a lifetime of battle.\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> Choose 3 Skills.\u003cbr>\u003cstrong>Life:\u003c/strong> Strong.\u003c/p>\n\u003cp>\u003cstrong>Starting Equipment:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>1 \u003ca class=\"tag\" href=\"items.html#adventurers-kit\" data-pop=\"item:adventurers-kit\">Adventurer&#39;s Kit\u003c/a>\u003c/li>\n\u003cli>d12 × 10 \u003ca class=\"tag\" href=\"items.html#aurel\" data-pop=\"item:aurel\">Aurel\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"tag\" href=\"items.html#scale-armor\" data-pop=\"item:scale-armor\">Scale Armor\u003c/a> and a \u003ca class=\"tag\" href=\"items.html#heater-shield\" data-pop=\"item:heater-shield\">Heater Shield\u003c/a>\u003c/li>\n\u003cli>2 Weapons of your choice\u003c/li>\n\u003c/ul>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Level\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Technique\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Technique\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Technique\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Technique\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Specialization:\u003c/strong> \u003ca class=\"tag\" href=\"specializations.html#defender\" data-pop=\"specialization:defender\">Defender\u003c/a>\u003c/p>\n\u003ch3>Class Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/features/technique.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"T\">\u003cdiv>\u003cp>\u003cstrong>Technique.\u003c/strong> \u003cspan class=\"traco-nivel\">Levels 1, 4, 7, and 10\u003c/span> You learn one Technique from the list below. You can&#39;t learn the same Technique twice, and some Techniques require a minimum level.\u003c/p>\u003cul class=\"tracos opcoes\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/brawler.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"B\">\u003cdiv>\u003cp>\u003cstrong>Brawler.\u003c/strong> Your Unarmed Attacks deal Medium \u003ca class=\"tag\" href=\"damage-types.html#blunt\" data-pop=\"damage:blunt\">Blunt\u003c/a> damage.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/dual-wielding.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Dual Wielding.\u003c/strong> Your \u003ca class=\"tag\" href=\"actions.html#secondary-attack\" data-pop=\"action:secondary-attack\">Secondary Attack\u003c/a> with a \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#weapon-properties\" data-pop=\"wproperty:light\">Light\u003c/a> Weapon deals full damage instead of half.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/dueling.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Dueling.\u003c/strong> While you wield a one-handed Weapon and no other Weapon, you have +1 to hit with it.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/extra-attack.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"E\">\u003cdiv>\u003cp>\u003cstrong>Extra Attack.\u003c/strong> \u003cspan class=\"traco-nivel\">Requires level 4\u003c/span> Your \u003ca class=\"tag\" href=\"actions.html#secondary-attack\" data-pop=\"action:secondary-attack\">Secondary Attack\u003c/a> can be made with your main Weapon, dealing full damage.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/great-weapon-fighting.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"G\">\u003cdiv>\u003cp>\u003cstrong>Great Weapon Fighting.\u003c/strong> While you wield a \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#weapon-properties\" data-pop=\"wproperty:two-handed\">Two-Handed\u003c/a> Weapon, add your Strength to its damage once per Turn.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/opportunist.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"O\">\u003cdiv>\u003cp>\u003cstrong>Opportunist.\u003c/strong> Your \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a> have Advantage, and when one hits, the target&#39;s Speed becomes 0 until the end of its Turn.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/protection.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"P\">\u003cdiv>\u003cp>\u003cstrong>Protection.\u003c/strong> While you have a shield equipped, when a creature attacks an ally within 1 Zone of you, you can use your Reaction to give that ally +2 Defense against that attack.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/second-wind.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"S\">\u003cdiv>\u003cp>\u003cstrong>Second Wind.\u003c/strong> Once per Rest, you can use a Minor Action to regain Strong (d8 &gt; d10 &gt; d12 &gt; 3d4) Life.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/shield-fighting.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"S\">\u003cdiv>\u003cp>\u003cstrong>Shield Fighting.\u003c/strong> While you have a shield equipped, when a creature makes a melee attack against you, you can use your Reaction to gain +2 Defense against that attack.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/thrown-weapon-fighting.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"T\">\u003cdiv>\u003cp>\u003cstrong>Thrown Weapon Fighting.\u003c/strong> When you throw a \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#weapon-properties\" data-pop=\"wproperty:thrown\">Thrown\u003c/a> Weapon, drawing it is part of that same attack, so you don&#39;t need to \u003ca class=\"tag\" href=\"actions.html#interact\" data-pop=\"action:interact\">Interact\u003c/a> to draw it. In addition, the ranges of your \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#weapon-properties\" data-pop=\"wproperty:thrown\">Thrown\u003c/a> Weapons increase by 2 Zones.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/classes/techniques/veteran.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"V\">\u003cdiv>\u003cp>\u003cstrong>Veteran.\u003c/strong> \u003cspan class=\"traco-nivel\">Requires level 7\u003c/span> Once per combat, you can reroll an attack or Test you failed.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#warrior"}}],"retrato":false};</script>
