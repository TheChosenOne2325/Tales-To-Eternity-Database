Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Mana erupts violently at a point within range. Each creature in a Circle with a radius of 2 Zones, including you if you&#39;re inside it, must make an Agility Test. On a failure, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#arcane-explosion"}},{"id":"arcane-fist","nome":"Arcane Fist","fonte":"FTC","icone":"spells/arcane-fist.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Touch","class":"Mage","damageType":"Arcane","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You wrap your fist in raw mana and punch. Make a Spell attack against a creature you touch. On a hit, it takes Brutal (2d6 &gt; 2d8 &gt; 2d10 &gt; 2d12) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage and is pushed 1 Zone away from you.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#arcane-fist"}},{"id":"arcane-nova","nome":"Arcane Nova","fonte":"FTC","icone":"spells/arcane-nova.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Arcane","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>You let the mana inside you burst out all at once. Each other creature in a Circle with a radius of 2 &gt; 2 &gt; 3 &gt; 3 Zones centered on you must make an Agility Test. On a failure, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage. You take Weak (d6 &gt; d8 &gt; d10 &gt; d12) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#arcane-nova"}},{"id":"arcane-torrent","nome":"Arcane Torrent","fonte":"FTC","icone":"spells/arcane-torrent.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Arcane","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A raw stream of mana pours from your hands. Each creature in a Cone of 2 Zones must make an Agility Test. On a failure, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#arcane-torrent"}},{"id":"barrier","nome":"Barrier","fonte":"FTC","icone":"spells/barrier.svg","tipo":"Protection Spell","campos":{"school":"Protection","action":"Main","range":"6 Zones","class":"Healer","damageType":"","concentration":"Yes","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Protection\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>, up to 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You raise a dome of solid mana in a Circle with a radius of 1 &gt; 1 &gt; 2 &gt; 2 Zones centered on a point within range. Creatures inside the dome have Partial Cover against attacks made from outside it.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#barrier"}},{"id":"chain-lightning","nome":"Chain Lightning","fonte":"FTC","icone":"spells/chain-lightning.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"6 Zones","class":"Mage","damageType":"Lightning","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Make a Spell attack against a creature within range. On a hit, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a> damage, and the lightning arcs to 1 &gt; 1 &gt; 2 &gt; 2 other creatures within 2 Zones of it, allies included. Each of them must make an Agility Test, taking the same damage on a failure.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#chain-lightning"}},{"id":"cleanse","nome":"Cleanse","fonte":"FTC","icone":"spells/cleanse.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"Touch","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You wash away a harmful effect. You end one Condition on the creature you touch. The Conditions you can end depend on the Tier:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Tier 1:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#blinded\" data-pop=\"condition:blinded\">Blinded\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#burned\" data-pop=\"condition:burned\">Burned\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#chilled\" data-pop=\"condition:chilled\">Chilled\u003c/a>, or \u003ca class=\"tag\" href=\"conditions.html#deafened\" data-pop=\"condition:deafened\">Deafened\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Tier 2:\u003c/strong> Also \u003ca class=\"tag\" href=\"conditions.html#mute\" data-pop=\"condition:mute\">Mute\u003c/a> or \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Tier 3:\u003c/strong> Also \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a> or \u003ca class=\"tag\" href=\"conditions.html#stunned\" data-pop=\"condition:stunned\">Stunned\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Tier 4:\u003c/strong> You can end two Conditions instead of one.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#cleanse"}},{"id":"concussive-bolt","nome":"Concussive Bolt","fonte":"FTC","icone":"spells/concussive-bolt.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"12 Zones","class":"Healer","damageType":"Blast","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You hurl a compressed bolt of force. Make a Spell attack against a creature within range. On a hit, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#blast\" data-pop=\"damage:blast\">Blast\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#concussive-bolt"}},{"id":"distant-mend","nome":"Distant Mend","fonte":"FTC","icone":"spells/distant-mend.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"12 Zones","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You send a stream of healing mana to a creature within range. It regains Medium (d6 &gt; d8 &gt; d10 &gt; d12) Life.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#distant-mend"}},{"id":"elemental-ward","nome":"Elemental Ward","fonte":"FTC","icone":"spells/elemental-ward.svg","tipo":"Protection Spell","campos":{"school":"Protection","action":"Main","range":"Touch","class":"Healer","damageType":"Freeze, Heat, Lightning","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Protection\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>The creature you touch gains Resistance to \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a>, \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a>, or \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a> damage (your choice). A creature can only be under one Elemental Ward at a time.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Tier 2:\u003c/strong> You can choose any damage type.\u003c/li>\n\u003cli>\u003cstrong>Tier 3:\u003c/strong> You can touch 2 creatures.\u003c/li>\n\u003cli>\u003cstrong>Tier 4:\u003c/strong> You can touch 3 creatures.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#elemental-ward"}},{"id":"fire-explosion","nome":"Fire Explosion","fonte":"FTC","icone":"spells/fire-explosion.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"4 Zones","class":"Mage","damageType":"Heat","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 4 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You don&#39;t shape a ball of fire; the air at a point within range simply detonates. Each creature in a Circle with a radius of 3 &gt; 3 &gt; 4 &gt; 4 Zones, including you if you&#39;re inside it, must make an Agility Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#fire-explosion"}},{"id":"flamethrower","nome":"Flamethrower","fonte":"FTC","icone":"spells/flamethrower.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Heat","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A torrent of fire pours from your hands. Each creature in a Cone of 2 Zones must make an Agility Test. On a failure, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#flamethrower"}},{"id":"flare","nome":"Flare","fonte":"FTC","icone":"spells/flare.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"4 Zones","class":"Mage","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 4 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>A blinding burst of light explodes at a point within range. Each creature in a Circle with a radius of 1 &gt; 1 &gt; 2 &gt; 2 Zones, including you if you&#39;re inside it, must make a Spirit Test. On a failure, it becomes \u003ca class=\"tag\" href=\"conditions.html#blinded\" data-pop=\"condition:blinded\">Blinded\u003c/a> until the end of its next Turn.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#flare"}},{"id":"force-break","nome":"Force Break","fonte":"FTC","icone":"spells/force-break.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Touch","class":"Mage","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You slam raw mana into an object. You break open a lock, door, chain, or similar object you touch. At Tier 1, it can be wooden or simple; at Tier 2, iron; at Tier 3, reinforced; at Tier 4, even magically sealed. The blast is loud and can be heard clearly within 12 Zones.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#force-break"}},{"id":"frost-nova","nome":"Frost Nova","fonte":"FTC","icone":"spells/frost-nova.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Freeze","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>Cold explodes out of you and freezes the ground. Each other creature in a Circle with a radius of 1 &gt; 1 &gt; 2 &gt; 2 Zones centered on you must make an Agility Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a> damage. The area becomes Difficult Terrain until the end of your next Turn.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#frost-nova"}},{"id":"frost-thrower","nome":"Frost Thrower","fonte":"FTC","icone":"spells/frost-thrower.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Freeze","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A freezing blast of ice and wind pours from your hands. Each creature in a Cone of 2 Zones must make an Agility Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a> damage and becomes \u003ca class=\"tag\" href=\"conditions.html#chilled\" data-pop=\"condition:chilled\">Chilled\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#frost-thrower"}},{"id":"healing-circle","nome":"Healing Circle","fonte":"FTC","icone":"spells/healing-circle.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"12 Zones","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Healing mana spreads across the ground. Each creature of your choice in a Circle with a radius of 2 Zones regains Weak (d4 &gt; d6 &gt; d8 &gt; d10) Life.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#healing-circle"}},{"id":"healing-pulse","nome":"Healing Pulse","fonte":"FTC","icone":"spells/healing-pulse.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"Self","class":"Healer","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>Healing mana pulses out from your body. You and each creature of your choice in a Circle with a radius of 1 &gt; 1 &gt; 2 &gt; 2 Zones centered on you regain Weak (d4 &gt; d6 &gt; d8 &gt; d10) Life.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#healing-pulse"}},{"id":"healing-touch","nome":"Healing Touch","fonte":"FTC","icone":"spells/healing-touch.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"Touch","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>The creature you touch regains Strong (d8 &gt; d10 &gt; d12 &gt; 3d4) Life.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#healing-touch"}},{"id":"ignite","nome":"Ignite","fonte":"FTC","icone":"spells/ignite.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Minor","range":"2 Zones","class":"Mage","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Minor\u003cbr>\u003cstrong>Range:\u003c/strong> 2 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Flammable objects that aren&#39;t being worn or carried in a Circle with a radius of 1 &gt; 1 &gt; 2 &gt; 2 Zones within range catch fire. You can use it to light torches and campfires, burn ropes, or set a room ablaze.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#ignite"}},{"id":"inspire","nome":"Inspire","fonte":"FTC","icone":"spells/inspire.svg","tipo":"Enchantment Spell","campos":{"school":"Enchantment","action":"Main","range":"6 Zones","class":"Healer","damageType":"","concentration":"Yes","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Enchantment\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>, up to 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>Your words fill your allies with resolve. Choose 2 &gt; 3 &gt; 4 &gt; 5 creatures within range. They gain +1 on attacks and Tests while the Spell lasts.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#inspire"}},{"id":"leaping-remedy","nome":"Leaping Remedy","fonte":"FTC","icone":"spells/leaping-remedy.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"12 Zones","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A pulse of healing mana leaps from ally to ally. Choose a creature within range. It regains Weak (d4 &gt; d6 &gt; d8 &gt; d10) Life, and then the mana bounces to 1 &gt; 2 &gt; 3 &gt; 4 other creatures of your choice, each within 3 Zones of the last one. Each of them also regains Weak Life. It can&#39;t heal the same creature twice.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#leaping-remedy"}},{"id":"life-link","nome":"Life Link","fonte":"FTC","icone":"spells/life-link.svg","tipo":"Protection Spell","campos":{"school":"Protection","action":"Reaction","range":"6 > 8 > 10 > 12 Zones","class":"Healer","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Protection\u003cbr>\u003cstrong>Action:\u003c/strong> Reaction, when a creature within range takes damage\u003cbr>\u003cstrong>Range:\u003c/strong> 6 &gt; 8 &gt; 10 &gt; 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>You take half of the damage instead of the target. The target takes only the other half.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#life-link"}},{"id":"lightning-bolt","nome":"Lightning Bolt","fonte":"FTC","icone":"spells/lightning-bolt.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Lightning","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A bolt of lightning tears forward in a Line of 4 &gt; 5 &gt; 6 &gt; 6 Zones. Each creature in the line must make an Agility Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#lightning-bolt"}},{"id":"mana-lantern","nome":"Mana Lantern","fonte":"FTC","icone":"spells/mana-lantern.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Minor","range":"Touch","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Minor\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> 1 hour\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>The object you touch glows with mana, shedding Bright Light in a 2 &gt; 3 &gt; 4 &gt; 5-Zone radius and Dim Light for the same distance beyond that. You can end the Spell early as a Minor Action.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#mana-lantern"}},{"id":"mana-recoil","nome":"Mana Recoil","fonte":"FTC","icone":"spells/mana-recoil.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Reaction","range":"Self","class":"Mage","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Reaction, when a creature within 1 Zone hits you with an attack\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>Mana bursts out of you on impact. The attacker must make a Strength Test. On a failure, it is pushed 2 &gt; 2 &gt; 3 &gt; 3 Zones away from you and falls \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#mana-recoil"}},{"id":"mana-rupture","nome":"Mana Rupture","fonte":"FTC","icone":"spells/mana-rupture.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"4 Zones","class":"Mage","damageType":"Arcane","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 4 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>You tear at the mana inside a creature within range. It must make a Spirit Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage and loses \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#mana-rupture"}},{"id":"protective-ward","nome":"Protective Ward","fonte":"FTC","icone":"spells/protective-ward.svg","tipo":"Protection Spell","campos":{"school":"Protection","action":"Minor","range":"6 Zones","class":"Healer","damageType":"","concentration":"Yes","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Protection\u003cbr>\u003cstrong>Action:\u003c/strong> Minor\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>, up to 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A shimmering ward surrounds a creature within range. It gains +1 &gt; +1 &gt; +2 &gt; +2 Defense while the Spell lasts.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#protective-ward"}},{"id":"quicken","nome":"Quicken","fonte":"FTC","icone":"spells/quicken.svg","tipo":"Enchantment Spell","campos":{"school":"Enchantment","action":"Minor","range":"6 Zones","class":"Healer","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Enchantment\u003cbr>\u003cstrong>Action:\u003c/strong> Minor\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Until the end of the target&#39;s next Turn\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>Choose 1 &gt; 1 &gt; 2 &gt; 2 creatures within range. Their Speed increases by 2 &gt; 2 &gt; 3 &gt; 3 Zones.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#quicken"}},{"id":"rejuvenation","nome":"Rejuvenation","fonte":"FTC","icone":"spells/rejuvenation.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"6 Zones","class":"Healer","damageType":"","concentration":"Yes","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>, up to 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>A creature within range regains Weak (d4 &gt; d6 &gt; d8 &gt; d10) Life at the start of each of its Turns while the Spell lasts.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#rejuvenation"}},{"id":"restore-vigor","nome":"Restore Vigor","fonte":"FTC","icone":"spells/restore-vigor.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Main","range":"Touch","class":"Healer","damageType":"","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You restore strength to a weakened body. The creature you touch removes 1 &gt; 1 &gt; 2 &gt; 2 Levels of \u003ca class=\"tag\" href=\"conditions.html#deprived\" data-pop=\"condition:deprived\">Deprived\u003c/a>. A creature can only benefit from this Spell once per Rest.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#restore-vigor"}},{"id":"sanctuary","nome":"Sanctuary","fonte":"FTC","icone":"spells/sanctuary.svg","tipo":"Protection Spell","campos":{"school":"Protection","action":"Main","range":"Touch","class":"Healer","damageType":"","concentration":"Yes","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Protection\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentration\u003c/a>, up to 1 minute\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You protect 1 &gt; 1 &gt; 2 &gt; 2 creatures you touch with a calming aura. Any creature that tries to attack a protected creature must first make a Spirit Test. On a failure, it must choose another target or lose the attack. The Spell ends on a protected creature if it makes an attack or Conjures a Spell that deals damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#sanctuary"}},{"id":"scorching-touch","nome":"Scorching Touch","fonte":"FTC","icone":"spells/scorching-touch.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Touch","class":"Mage","damageType":"Heat","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Your hands ignite with searing heat. Make a Spell attack against a creature you touch. On a hit, it takes Brutal (2d6 &gt; 2d8 &gt; 2d10 &gt; 2d12) \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#scorching-touch"}},{"id":"shocking-grasp","nome":"Shocking Grasp","fonte":"FTC","icone":"spells/shocking-grasp.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Touch","class":"Mage","damageType":"Lightning","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>\u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a> jumps from your hand. Make a Spell attack against a creature you touch. On a hit, it takes Strong (d10 &gt; d12 &gt; 3d4 &gt; 2d8) \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a> damage and can&#39;t take Reactions until the start of its next Turn.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#shocking-grasp"}},{"id":"shockwave","nome":"Shockwave","fonte":"FTC","icone":"spells/shockwave.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Blast","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You stomp and send a wave of force rolling forward in a Line of 4 &gt; 4 &gt; 5 &gt; 5 Zones. Each creature in the line must make a Strength Test. On a failure, it takes Weak (d6 &gt; d8 &gt; d10 &gt; d12) \u003ca class=\"tag\" href=\"damage-types.html#blast\" data-pop=\"damage:blast\">Blast\u003c/a> damage and falls \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#shockwave"}},{"id":"soothe","nome":"Soothe","fonte":"FTC","icone":"spells/soothe.svg","tipo":"Enchantment Spell","campos":{"school":"Enchantment","action":"Main","range":"12 Zones","class":"Healer","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Enchantment\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> 12 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Until the end of the target&#39;s next Turn\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>You flood a mind with calm. Choose 1 &gt; 1 &gt; 2 &gt; 2 creatures within range. Each must make a Spirit Test. On a failure, it becomes \u003ca class=\"tag\" href=\"conditions.html#incapacitated\" data-pop=\"condition:incapacitated\">Incapacitated\u003c/a>. The effect ends early on a creature if it takes damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#soothe"}},{"id":"swift-mend","nome":"Swift Mend","fonte":"FTC","icone":"spells/swift-mend.svg","tipo":"Restoration Spell","campos":{"school":"Restoration","action":"Reaction","range":"6 Zones","class":"Healer","damageType":"","concentration":"No","components":"V"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Restoration\u003cbr>\u003cstrong>Action:\u003c/strong> Reaction, when a creature within range takes damage\u003cbr>\u003cstrong>Range:\u003c/strong> 6 Zones\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V\u003c/p>\n\u003cp>The target regains Weak (d4 &gt; d6 &gt; d8 &gt; d10) Life.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#swift-mend"}},{"id":"thunderclap","nome":"Thunderclap","fonte":"FTC","icone":"spells/thunderclap.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Self","class":"Mage","damageType":"Blast","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Self\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>You clap your hands with a deafening boom. Each other creature in a Circle with a radius of 1 Zone centered on you must make a Strength Test. On a failure, it takes Medium (d8 &gt; d10 &gt; d12 &gt; 3d4) \u003ca class=\"tag\" href=\"damage-types.html#blast\" data-pop=\"damage:blast\">Blast\u003c/a> damage and is pushed 2 Zones away from you.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#thunderclap"}},{"id":"withering-touch","nome":"Withering Touch","fonte":"FTC","icone":"spells/withering-touch.svg","tipo":"Creation Spell","campos":{"school":"Creation","action":"Main","range":"Touch","class":"Healer","damageType":"Arcane","concentration":"No","components":"V, S"},"html":"\u003cp>\u003cstrong>School:\u003c/strong> Creation\u003cbr>\u003cstrong>Action:\u003c/strong> Main\u003cbr>\u003cstrong>Range:\u003c/strong> Touch\u003cbr>\u003cstrong>Duration:\u003c/strong> Instant\u003cbr>\u003cstrong>Components:\u003c/strong> V, S\u003c/p>\n\u003cp>Your touch drains the strength from an enemy. Make a Spell attack against a creature you touch. On a hit, it takes Brutal (2d6 &gt; 2d8 &gt; 2d10 &gt; 2d12) \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>Classes:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#withering-touch"}}],"retrato":false};</script>
