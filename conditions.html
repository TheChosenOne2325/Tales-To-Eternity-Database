<script>window.TTE_BANCO = {"titulo":"Conditions","colunas":[],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"blinded","nome":"Blinded","fonte":"FTC","icone":"conditions/blinded.svg","tipo":"Condition","campos":{},"html":"\u003cp>You can&#39;t see. You automatically fail all Tests that require sight, you make attacks with Disadvantage, and attacks against you have Advantage.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"deafened","nome":"Deafened","fonte":"FTC","icone":"conditions/deafened.svg","tipo":"Condition","campos":{},"html":"\u003cp>You can&#39;t hear. You automatically fail all Tests that require hearing.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"mute","nome":"Mute","fonte":"FTC","icone":"conditions/mute.svg","tipo":"Condition","campos":{},"html":"\u003cp>You can&#39;t speak, and you can&#39;t Conjure Spells.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"burned","nome":"Burned","fonte":"FTC","icone":"conditions/burned.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are on fire. At the end of your Turn, if you still have this Condition, you take Medium Heat damage based on the Condition&#39;s Tier. To end the Condition early, you must become Prone and roll on the ground. Water, ice, and the Chilled condition also end Burned.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"chilled","nome":"Chilled","fonte":"FTC","icone":"conditions/chilled.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are freezing. At the end of your Turn, you take Weak Freeze damage based on the Condition&#39;s Tier, and your Speed is halved. Warming yourself up or gaining the Burned condition ends Chilled.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"deprived","nome":"Deprived","fonte":"FTC","icone":"conditions/deprived.svg","tipo":"Condition","campos":{},"html":"\u003cp>Represents the physical deterioration of your body caused by poor nourishment and other hardships. It has 5 Levels:\u003c/p>\n\u003col>\n\u003cli>Disadvantage on attacks and Conjuring.\u003c/li>\n\u003cli>Your Speed is halved.\u003c/li>\n\u003cli>Disadvantage on all Attribute Tests.\u003c/li>\n\u003cli>Your maximum Life is halved.\u003c/li>\n\u003cli>Every time you gain another Level of this Condition, you gain 1 Wound.\u003c/li>\n\u003c/ol>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"fainted","nome":"Fainted","fonte":"FTC","icone":"conditions/fainted.svg","tipo":"Condition","campos":{},"html":"\u003cp>You have lost consciousness, becoming Incapacitated and Prone. You drop everything you&#39;re holding, your Speed becomes 0, and you&#39;re unaware of your surroundings. Attacks from within 1 Zone automatically hit and are Critical Hits, and you automatically fail Strength, Agility, and Dexterity Tests.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"hidden","nome":"Hidden","fonte":"FTC","icone":"conditions/hidden.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are hidden from a creature. Your attacks against that creature have Advantage, and its attacks against you have Disadvantage. Making noise, being seen, attacking, and other Actions can make you lose this Condition.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"injured","nome":"Injured","fonte":"FTC","icone":"conditions/injured.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are Injured while you have half or less of your maximum Life.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"scared","nome":"Scared","fonte":"FTC","icone":"conditions/scared.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are afraid of something. You can&#39;t willingly move toward the source of your fear, and you roll with Disadvantage while the source of your fear is within your sight.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"incapacitated","nome":"Incapacitated","fonte":"FTC","icone":"conditions/incapacitated.svg","tipo":"Condition","campos":{},"html":"\u003cp>You can only take Movement Actions, you are Mute, and you can&#39;t take Reactions. You lose Concentration.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"prone","nome":"Prone","fonte":"FTC","icone":"conditions/prone.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are lying on the ground and can only move by Crawling. Your attacks have Disadvantage. Attacks against you from within 1 Zone have Advantage, while Ranged Attacks from farther away have Disadvantage. You can use Stand Up to end this Condition.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"restrained","nome":"Restrained","fonte":"FTC","icone":"conditions/restrained.svg","tipo":"Condition","campos":{},"html":"\u003cp>Your Speed becomes 0. Attacks against you have Advantage, and your attacks have Disadvantage.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"concentrating","nome":"Concentrating","fonte":"FTC","icone":"conditions/concentrating.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are concentrating on a Spell. Its duration depends on the Spell, and it can end in the following ways:\u003c/p>\n\u003cul>\n\u003cli>You end it voluntarily.\u003c/li>\n\u003cli>You Conjure another Concentration Spell.\u003c/li>\n\u003cli>You take damage. To maintain Concentration, make a Test with your Conjuring Attribute against a Difficulty of 10 or half the damage you took, whichever is higher.\u003c/li>\n\u003cli>You become Incapacitated or die.\u003c/li>\n\u003c/ul>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}},{"id":"stunned","nome":"Stunned","fonte":"FTC","icone":"conditions/stunned.svg","tipo":"Condition","campos":{},"html":"\u003cp>You are stunned. You are Incapacitated, you automatically fail Strength, Agility, and Dexterity Tests, and attacks against you have Advantage.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#conditions"}}],"retrato":false};</script>
