<script>window.TTE_BANCO = {"titulo":"Actions","colunas":[{"campo":"type","titulo":"Type"}],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"move","nome":"Move","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>Move a number of Zones up to your Speed.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"drop-prone","nome":"Drop Prone","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>You willingly gain the Prone condition.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"crawl","nome":"Crawl","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>While Prone, you can only move by Crawling. Movement costs +1 Zone, or +2 Zones through Difficult Terrain.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"stand-up","nome":"Stand Up","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>Remove the Prone condition. Standing up costs 2 Zones of movement.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"climb","nome":"Climb","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>Climbing costs +1 Zone, or +2 Zones through Difficult Terrain, unless you have a Climb Speed.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"swim","nome":"Swim","fonte":"FTC","icone":null,"tipo":"Action · Movement","campos":{"type":"Movement"},"html":"\u003cp>Swimming costs +1 Zone, or +2 Zones through Difficult Terrain, unless you have a Swim Speed.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#movement-action"}},{"id":"attack","nome":"Attack","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You make an attack with a Weapon, an Unarmed Attack, or another attack source.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"conjure","nome":"Conjure","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You Conjure a Spell.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"dash","nome":"Dash","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You gain additional movement equal to your Speed.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"interact","nome":"Interact","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You interact with a second object. Interacting with one object is free.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"search","nome":"Search","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You search for something using your Attributes or Skills.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"hide","nome":"Hide","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You make a Test to hide. On a success, you gain the Hidden condition.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"help","nome":"Help","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You help another creature.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"disengage","nome":"Disengage","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>You make a careful retreat, preventing Opportunity Attacks.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"dodge","nome":"Dodge","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>Attacks against you have Disadvantage until your next Turn.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"improvise","nome":"Improvise","fonte":"FTC","icone":null,"tipo":"Action · Main","campos":{"type":"Main"},"html":"\u003cp>If the Action you want to perform doesn&#39;t fit any of the others, you can improvise. The Game Master determines the Test, the Difficulty, and whether the Action is possible.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#main-action"}},{"id":"secondary-attack","nome":"Secondary Attack","fonte":"FTC","icone":null,"tipo":"Action · Minor","campos":{"type":"Minor"},"html":"\u003cp>You make an attack with your Secondary Weapon.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#minor-action"}},{"id":"opportunity-attack","nome":"Opportunity Attack","fonte":"FTC","icone":null,"tipo":"Action · Reaction","campos":{"type":"Reaction"},"html":"\u003cp>If a creature leaves your Melee Reach without using Disengage, you can make an attack against it. Forced Movement doesn&#39;t trigger this attack.\u003c/p>\n","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#reaction"}}],"retrato":false};</script>
