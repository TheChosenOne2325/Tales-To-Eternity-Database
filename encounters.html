"scale",2],"DEX":["fixed",0],"AGI":["fixed",2],"INT":["fixed",0],"SPI":["fixed",2],"CHA":["fixed",1]},"ataques":[["STR","Strong"]],"res":0,"extra":0}},{"id":"dragon","nome":"Dragon","icone":"monsters/dragon.webp","tipo":"Dragon","html":"\u003cp>An ancient winged dragon, as intelligent as it is proud, sitting on a hoard gathered over centuries.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>11 &gt; 12 &gt; 13 &gt; 14\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>DEX\u003c/strong> +2 · \u003cstrong>AGI\u003c/strong> +3 · \u003cstrong>INT\u003c/strong> +3 · \u003cstrong>SPI\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>CHA\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4\u003c/p>\n\u003cp>\u003cstrong>Skills:\u003c/strong> \u003ca class=\"tag\" href=\"skills.html#perception\" data-pop=\"skill:perception\">Perception\u003c/a> +3, \u003ca class=\"tag\" href=\"skills.html#lore\" data-pop=\"skill:lore\">Lore\u003c/a> +3\u003cbr>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:darkvision\">Darkvision\u003c/a> 24\u003cbr>\u003cstrong>Languages:\u003c/strong> Common, Draconic\u003c/p>\n\u003ch3 id=\"traits\">Traits\u003c/h3>\n\u003cp>\u003cstrong>\u003ca class=\"tag\" href=\"monster-abilities.html#flight\" data-pop=\"ability:flight\">Flight\u003c/a>.\u003c/strong> It can fly with a Speed of 16.\u003c/p>\n\u003cp>\u003cstrong>Element.\u003c/strong> Choose its element: \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> (red), \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a> (white), \u003ca class=\" span>) or is pushed 2 Zones and falls \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Fly.\u003c/strong> It flies up to half its Speed without provoking \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a>.\u003c/p>\n","escala":{"level":12,"role":"Boss","life":"Medium","def":11,"attrs":{"STR":["scale",2],"DEX":["fixed",2],"AGI":["fixed",3],"INT":["fixed",3],"SPI":["scale",1],"CHA":["scale",1]},"ataques":[["STR","Medium"]],"res":0,"extra":0}},{"id":"drake","nome":"Drake","icone":"monsters/drake.webp","tipo":"Dragon","html":"\u003cp>Wingless cousins of the dragons, fast and with a deadly breath.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>12 &gt; 13 &gt; 14 &gt; 15\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>INT\u003c/strong> -2 · \u003cstrong>SPI\u003c/strong> +1 · \u003cstrong>CHA\u003c/strong> +0\u003c/p>\n\u003cp>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:darkvision\">Darkvision\u003c/a> 12\u003cbr>\u003cstrong>Languages:\u003c/strong> Draconic\u003c/p>\n\u003ch3 id=\"traits\">Traits\u003c/h3>\n\u003cp>\u003cstrong>Element.\u003c/strong> Choose its element: \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a>, \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a>, \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a>, or \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a>. Its Breath deals that damage type, and it has Resistance to it.\u003c/p>\n\u003ch3 id=\"actions\">Actions\u003c/h3>\n\u003cp>\u003cstrong>Bite.\u003c/strong> Melee attack \u003cspan class=\"esc-atk\" data-a=\"AGI\">(Agility)\u003c/span>, reach 1 Zone. \u003cspan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> \u003ca class=\"tag\" href=\"damage-types.html#thrust\" data-pop=\"damage:thrust\">Thrust\u003c/a> damage.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"tag\" href=\"monster-abilities.html#breath\" data-pop=\"ability:breath\">Breath\u003c/a>.\u003c/strong> Once per combat, a Cone of 3 Zones. Each creature in it makes an Agility Test (Difficulty \u003cspan class=\"esc-dc\" data-a=\"AGI\">Agility\u003c/span>) or takes \u003cspan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> damage of its element.\u003c/p>\n","escala":{"level":5,"role":"Standard","life":"Medium","def":12,"attrs":{"STR":["scale",1],"DEX":["fixed",0],"AGI":["scale",2],"INT":["fixed",-2],"SPI":["fixed",1],"CHA":["fixed",0]},"ataques":[["AGI","Medium"]],"res":0,"extra":0}},{"id":"elemental","nome":"Elemental","icone":"monsters/elemental.webp","tipo":"Elemental","html":"\u003cp>Living fire, ice, or lightning, given shape and fury by raw mana.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>11 &gt; 12 &gt; 13 &gt; 14\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>INT\u003c/strong> -2 >, reach 1 Zone. \u003cspan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> \u003ca class=\"tag\" href=\"damage-types.html#cut\" data-pop=\"damage:cut\">Cut\u003c/a> damage.\u003c/p>\n\u003ch3 id=\"reactions\">Reactions\u003c/h3>\n\u003cp>\u003cstrong>Protect.\u003c/strong> When an ally adjacent to it is hit by an attack, it can halve that damage and take the other half itself.\u003c/p>\n","escala":{"level":3,"role":"Standard","life":"Weak","def":13,"attrs":{"STR":["scale",2],"DEX":["scale",1],"AGI":["scale",1],"INT":["fixed",0],"SPI":["fixed",0],"CHA":["fixed",0]},"ataques":[["STR","Medium"]],"res":0,"extra":0}},{"id":"star-eater","nome":"Star Eater","icone":"monsters/star-eater.webp","tipo":"Aberration","html":"\u003cp>A colossal beast of starlight, crowned with plumes that move like tendrils, that devours light and magic: the herald of the cosmos breaking apart.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>10 &gt; 11 &gt; 12 &gt; 13\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +1 · \u003cstrong>INT\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>SPI\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>CHA\u003c/strong> +2\u003c/p>\n\u003cp>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:blindsight\">Blindsight\u003c/a> 24\u003cbr>\u003cstrong>Languages:\u003c/strong> understands all languages but doesn&#39;t speak\u003cbr>\u003cstrong>Affinities:\u003c/strong> Resistance to \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a>\ \u003ca class=\"tag\" href=\"monster-abilities.html#attack\" data-pop=\"ability:attack\">Attack\u003c/a>.\u003c/strong> It makes a Tendril attack.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"tag\" href=\"monster-abilities.html#command\" data-pop=\"ability:command\">Command\u003c/a>.\u003c/strong> A Void Spawn it can see moves up to its Speed or makes one attack, using its Reaction.\u003c/p>\n\u003cp>\u003cstrong>\u003ca class=\"tag\" href=\"monster-abilities.html#shake-off\" data-pop=\"ability:shake-off\">Shake Off (2 actions)\u003c/a>.\u003c/strong> It ends one Condition on itself.\u003c/p>\n","escala":{"level":11,"role":"Boss","life":"Medium","def":10,"attrs":{"STR":["scale",2],"DEX":["fixed",0],"AGI":["fixed",1],"INT":["scale",1],"SPI":["scale",2],"CHA":["fixed",2]},"ataques":[["STR","Medium"]],"res":0,"extra":0}},{"id":"thornling","nome":"Thornling","icone":"monsters/thornling.webp","tipo":"Plant","html":"\u003cp>A walking tangle of thorny vines that drags its prey into the undergrowth.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Weak\u003c/span>\u003c/td>\n\u003ctd>12 &gt; 13 &gt; 14 &gt; 15\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>INT\u003c/strong> -3 · \u003cstrong>SPI\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>CHA\u003c/strong> -3\u003c/p>\n\u003cp>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:blindsight\">Blindsight\u003c/a> 6\u003cbr>\u003cstrong>Affinities:\u003c/strong> Vulnerability to \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a>\u003cbr pan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage, and it regains Life equal to half the damage dealt.\u003c/p>\n\u003cp>\u003cstrong>Dread Wail.\u003c/strong> Once per combat, each creature within 3 Zones that can hear it makes a Spirit Test (Difficulty \u003cspan class=\"esc-dc\" data-a=\"SPI\">Spirit\u003c/span>) or becomes \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a> until the end of its next turn.\u003c/p>\n","escala":{"level":7,"role":"Elite","life":"Weak","def":10,"attrs":{"STR":["fixed",-2],"DEX":["fixed",0],"AGI":["scale",2],"INT":["fixed",1],"SPI":["scale",1],"CHA":["fixed",2]},"ataques":[["AGI","Medium"]],"res":3,"extra":0}},{"id":"zombie","nome":"Zombie","icone":"monsters/zombie.webp","tipo":"Undead","html":"\u003cp>Rotting corpses that shamble toward the living and refuse to stay down.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>9 &gt; 10 &gt; 11 &gt; 12\u003c/td>\n\u003ctd>4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>DEX\u003c/strong> -2 · \u003cstrong>AGI\u003c/strong> -1 · \u003cstrong>INT\u003c/strong> -4 · \u003cstrong>SPI\u003c/strong> +0 · \u003cstrong>CHA\u003c/strong> -4\u003c/p>\n\u003cp>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros/fragments-of-the-cosmos.html#vision\" data-pop=\"sense:darkvision\">Darkvision\u003c/a> 12\u003cbr>\u003cstrong>Condition Immunities:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#deprived\" data-pop=\"condition:deprived\">Deprived\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a>\u003c/p>\n\u003ch3 id=\"traits\">Traits\u003c/h3>\n\u003cp>\u003cstrong>\u003ca class=\"tag\" href=\"monster-abilities.html#undying\" data-pop=\"ability:undying\">Undying\u003c/a>.\u003c/strong> The first time each combat it would drop to 0 Life, it drops to 1 instead, unless the damage was \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> or a critical hit.\u003c/p>\n\u003ch3 id=\"actions\">Actions\u003c/h3>\n\u003cp>\u003cstrong>Slam.\u003c/strong> Melee attack \u003cspan class=\"esc-atk\" data-a=\"STR\">(Strength)\u003c/span>, reach 1 Zone. \u003cspan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> \u003ca class=\"tag\" href=\"damage-types.html#blunt\" data-pop=\"damage:blunt\">Blunt\u003c/a> damage.\u003c/p>\n","escala":{"level":2,"role":"Standard","life":"Medium","def":9,"attrs":{"STR":["scale",2],"DEX":["fixed",-2],"AGI":["fixed",-1],"INT":["fixed",-4],"SPI":["fixed",0],"CHA":["fixed",-4]},"ataques":[["STR","Medium"]],"res":0,"extra":1}}],"habilidades":[{"id":"amphibious","nome":"Amphibious","categoria":"Trait","html":"\u003cp>\u003cstrong>Amphibious.\u003c/strong> It can breathe air and water.\u003c/p>\n"},{"id":"aura-damage-type","nome":"Aura (Damage Type)","categoria":"Trait","html":"\u003cp>\u003cstrong>Aura (Damage Type).\u003c/strong> A creature that starts its turn adjacent to it takes Weak damage of that type.\u003c/p>\n"},{"id":"flight","nome":"Flight","categoria":"Trait","html":"\u003cp>\u003cstrong>Flight.\u003c/strong> It can fly with its Speed.\u003c/p>\n"},{"id":"keen-senses","nome":"Keen Senses","categoria":"Trait","html":"\u003cp>\u003cstrong>Keen Senses.\u003c/strong> It has Advantage on \u003ca class=\"tag\" href=\"skills.html#perception\" data-pop=\"skill:perception\">Perception\u003c/a> Tests.\u003c/p>\n"},{"id":"pack-tactics","nome":"Pack Tactics","categoria":"Trait","html":"\u003cp>\u003cstrong>Pack Tactics.\u003c/strong> Its attacks have Advantage against a creature adjacent to one of its allies.\u003c/p>\n"},{"id":"regeneration","nome":"Regeneration","categoria":"Trait","html":"\u003cp>\u003cstrong>Regeneration.\u003c/strong> At the start of its turn, it regains Weak Life. Choose a damage type: if it took damage of that type since its last turn, it doesn&#39;t regenerate.\u003c/p>\n"},{"id":"sunlight-weakness","nome":"Sunlight Weakness","categoria":"Trait","html":"\u003cp>\u003cstrong>Sunlight Weakness.\u003c/strong> In bright sunlight, its attacks and Tests have Disadvantage.\u003c/p>\n"},{"id":"undying","nome":"Undying","categoria":"Trait","html":"\u003cp>\u003cstrong>Undying.\u003c/strong> The first time each combat it would drop to 0 Life, it drops to 1 instead, unless the damage was \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a> or a critical hit.\u003c/p>\n"},{"id":"breath","nome":"Breath","categoria":"Action","html":"\u003cp>\u003cstrong>Breath (once per combat).\u003c/strong> A Cone of 3 Zones. Each creature in it makes an Agility Test. On a failure, it takes Medium damage of the monster&#39;s type.\u003c/p>\n"},{"id":"charge","nome":"Charge","categoria":"Action","html":"\u003cp>\u003cstrong>Charge.\u003c/strong> If it moves at least 3 Zones in a straight line before attacking, the target must make a Strength Test or fall \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>.\u003c/p>\n"},{"id":"drain","nome":"Drain","categoria":"Action","html":"\u003cp>\u003cstrong>Drain.\u003c/strong> Make an attack. On a hit, it deals Medium damage and the monster regains Life equal to half the damage dealt.\u003c/p>\n"},{"id":"frightful-presence","nome":"Frightful Presence","categoria":"Action","html":"\u003cp>\u003cstrong>Frightful Presence (once per combat).\u003c/strong> Each creature within 3 Zones that can see it makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a> until the end of its next turn.\u003c/p>\n"},{"id":"grab","nome":"Grab","categoria":"Action","html":"\u003cp>\u003cstrong>Grab.\u003c/strong> Make an attack. On a hit, it deals Weak damage and the target becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a> until it uses its Main Action to make a Strength or Agility Test to escape.\u003c/p>\n"},{"id":"petrifying-gaze","nome":"Petrifying Gaze","categoria":"Action","html":"\u003cp>\u003cstrong>Petrifying Gaze (once per combat).\u003c/strong> A creature within 6 Zones makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>. It repeats the Test at the end of each of its turns, ending the effect on a success.\u003c/p>\n"},{"id":"poison","nome":"Poison","categoria":"Action","html":"\u003cp>\u003cstrong>Poison.\u003c/strong> When it hits with an attack, the target makes a Strength Test or takes Weak extra damage at the end of each of its turns, repeating the Test at the end of each turn.\u003c/p>\n"},{"id":"spellcasting","nome":"Spellcasting","categoria":"Action","html":"\u003cp>\u003cstrong>Spellcasting.\u003c/strong> It knows 2 Spells from \u003ca href=\"../livros/fragments-of-the-cosmos.html\">Fragments Of The Cosmos\u003c/a> and can Conjure each one twice per combat, without spending Mana, at its own tier.\u003c/p>\n"},{"id":"swallow","nome":"Swallow","categoria":"Action","html":"\u003cp>\u003cstrong>Swallow.\u003c/strong> Make an attack against a creature at least one size smaller. On a hit, it deals Medium damage and the target is swallowed: it is \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>, can only attack the monster, and takes Weak damage at the start of each of its turns. It escapes if it deals damage equal to a quarter of the monster&#39;s maximum Life in one turn.\u003c/p>\n"},{"id":"web","nome":"Web","categoria":"Action","html":"\u003cp>\u003cstrong>Web (once per combat).\u003c/strong> A Square of 2 Zones within 6 Zones. Each creature in it makes an Agility Test or becomes \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>, repeating the Test at the end of each of its turns.\u003c/p>\n"},{"id":"parry","nome":"Parry","categoria":"Reaction","html":"\u003cp>\u003cstrong>Parry (once per combat).\u003c/strong> When it&#39;s hit by a melee attack, it reduces the damage by half.\u003c/p>\n"},{"id":"retaliate","nome":"Retaliate","categoria":"Reaction","html":"\u003cp>\u003cstrong>Retaliate.\u003c/strong> When a creature adjacent to it hits it with a melee attack, it makes an attack against that creature.\u003c/p>\n"},{"id":"spiteful-burst","nome":"Spiteful Burst","categoria":"Reaction","html":"\u003cp>\u003cstrong>Spiteful Burst.\u003c/strong> When it drops to 0 Life, each creature adjacent to it takes Weak damage of the monster&#39;s type.\u003c/p>\n"},{"id":"attack","nome":"Attack","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Attack.\u003c/strong> It makes one attack.\u003c/p>\n"},{"id":"command","nome":"Command","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Command.\u003c/strong> An ally it can see moves up to its Speed or makes one attack, using its Reaction.\u003c/p>\n"},{"id":"move","nome":"Move","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Move.\u003c/strong> It moves up to half its Speed without provoking \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a>.\u003c/p>\n"},{"id":"roar","nome":"Roar","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Roar (once per combat).\u003c/strong> Each enemy within 3 Zones makes a Spirit Test or becomes \u003ca class=\"tag\" href=\"conditions.html#scared\" data-pop=\"condition:scared\">Scared\u003c/a> until the end of the Boss&#39;s next turn.\u003c/p>\n"},{"id":"shake-off","nome":"Shake Off","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Shake Off (2 actions).\u003c/strong> It ends one Condition on itself.\u003c/p>\n"},{"id":"signature","nome":"Signature","categoria":"Boss Action","html":"\u003cp>\u003cstrong>Signature (2 actions).\u003c/strong> It uses one of its abilities that isn&#39;t limited to once per combat.\u003c/p>\n"}]};</script><script src="monstros.js"></script><script>TTE_Monstro.construtor(document.querySelector("[data-enc]"), window.TTE_ENC, document.body.dataset.base);</script>
