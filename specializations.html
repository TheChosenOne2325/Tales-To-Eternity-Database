<script>window.TTE_BANCO = {"titulo":"Specializations","colunas":[{"campo":"class","titulo":"Class"}],"filtros":[],"fontes":{"FTC":"Fragments Of The Cosmos","COC":"Creation Of The Cosmos","ROC":"Rupture Of The Cosmos"},"itens":[{"id":"deadshot","nome":"Deadshot","fonte":"FTC","icone":"specializations/deadshot.svg","tipo":"Archer Specialization","campos":{"class":"Archer"},"html":"\u003cp>Deadshots pick a single target and bring it down as quickly as possible before moving on to the next. They are patient and cold, studying their prey for the one shot that ends the fight.\u003c/p>\n\u003cp>\u003cstrong>Class:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#archer\" data-pop=\"class:archer\">Archer\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/mark-prey.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"M\">\u003cdiv>\u003cp>\u003cstrong>Mark Prey.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 2\u003c/span> As a Minor Action, you mark a creature you can see. Your Weapon attacks against the marked creature deal +1 &gt; +2 &gt; +3 &gt; +4 damage. Only one creature can be marked at a time, and the mark lasts until the end of the combat. When the marked creature reaches 0 Life, you can mark a new creature for free.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/relentless-aim.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"R\">\u003cdiv>\u003cp>\u003cstrong>Relentless Aim.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 5\u003c/span> When you miss your marked creature, you can reroll the attack. You can use this feature 1 &gt; 2 &gt; 3 times per combat.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/deadeye.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Deadeye.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 8\u003c/span> Your attacks against your marked creature score a Critical Hit on a natural 19 or 20.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/killing-shot.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"K\">\u003cdiv>\u003cp>\u003cstrong>Killing Shot.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 11\u003c/span> Once per combat, when you hit your marked creature, you can turn the hit into a Critical Hit.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#specialization-deadshot"}},{"id":"field-doctor","nome":"Field Doctor","fonte":"FTC","icone":"specializations/field-doctor.svg","tipo":"Healer Specialization","campos":{"class":"Healer"},"html":"\u003cp>Field Doctors focus on speed. They cross the battlefield at a run, weaving between enemies to reach a fallen ally, and they would rather drag a friend out of danger than wait for the danger to pass.\u003c/p>\n\u003cp>\u003cstrong>Class:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#healer\" data-pop=\"class:healer\">Healer\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/fleet-medic.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"F\">\u003cdiv>\u003cp>\u003cstrong>Fleet Medic.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 2\u003c/span> Your Speed increases by 1 Zone, and moving through an ally&#39;s Zone doesn&#39;t cost you extra movement.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/combat-medic.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"C\">\u003cdiv>\u003cp>\u003cstrong>Combat Medic.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 5\u003c/span> When an ally within 6 Zones of you is \u003ca class=\"tag\" href=\"conditions.html#injured\" data-pop=\"condition:injured\">Injured\u003c/a> or \u003ca class=\"tag\" href=\"conditions.html#fainted\" data-pop=\"condition:fainted\">Fainted\u003c/a>, you can take the \u003ca class=\"tag\" href=\"actions.html#dash\" data-pop=\"action:dash\">Dash\u003c/a> action as a Minor Action, as long as you move toward that ally.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/evacuation.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"E\">\u003cdiv>\u003cp>\u003cstrong>Evacuation.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 8\u003c/span> When you move, you can carry a willing or \u003ca class=\"tag\" href=\"conditions.html#fainted\" data-pop=\"condition:fainted\">Fainted\u003c/a> creature within 1 Zone of you along with you, and it ends its movement within 1 Zone of you. Neither of you provokes \u003ca class=\"tag\" href=\"actions.html#opportunity-attack\" data-pop=\"action:opportunity-attack\">Opportunity Attacks\u003c/a> during this movement.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/never-too-late.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"N\">\u003cdiv>\u003cp>\u003cstrong>Never Too Late.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 11\u003c/span> Once per combat, when an ally within 6 Zones of you drops to 0 Life, you can use your Reaction to move up to your Speed toward them. If you end within 1 Zone of them, you can use First Aid on them as part of the same Reaction.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#specialization-field-doctor"}},{"id":"arcanist","nome":"Arcanist","fonte":"FTC","icone":"specializations/arcanist.svg","tipo":"Mage Specialization","campos":{"class":"Mage"},"html":"\u003cp>Arcanists focus on \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage and Arcane effects. They work with mana in its purest form, untouched by fire, frost, or lightning, and their spells unravel the magic of anything they strike.\u003c/p>\n\u003cp>\u003cstrong>Class:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#mage\" data-pop=\"class:mage\">Mage\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/mana-disruption.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"M\">\u003cdiv>\u003cp>\u003cstrong>Mana Disruption.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 2\u003c/span> When a creature takes \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage from one of your Spells, it can&#39;t take Reactions until the start of its next Turn.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/arcane-focus.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"A\">\u003cdiv>\u003cp>\u003cstrong>Arcane Focus.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 5\u003c/span> Your Spells that deal \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage ignore Resistance to \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/arcane-echo.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"A\">\u003cdiv>\u003cp>\u003cstrong>Arcane Echo.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 8\u003c/span> Once per combat, after you Conjure a Spell that deals \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage, you can Conjure it again as a Minor Action, paying its MP cost as normal.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/pure-mana.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"P\">\u003cdiv>\u003cp>\u003cstrong>Pure Mana.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 11\u003c/span> When you use Overcharge on a Spell that deals \u003ca class=\"tag\" href=\"damage-types.html#arcane\" data-pop=\"damage:arcane\">Arcane\u003c/a> damage, you don&#39;t take damage.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#specialization-arcanist"}},{"id":"street-scoundrel","nome":"Street Scoundrel","fonte":"FTC","icone":"specializations/street-scoundrel.svg","tipo":"Thief Specialization","campos":{"class":"Thief"},"html":"\u003cp>Street Scoundrels specialize in dirty fighting. Sand in the eyes, a kick to the knee, a blade in the back: they use whatever works, and they are at their most dangerous when their enemy is already struggling.\u003c/p>\n\u003cp>In this Specialization, a \u003cstrong>hindered\u003c/strong> creature is one that has any Condition other than \u003ca class=\"tag\" href=\"conditions.html#concentrating\" data-pop=\"condition:concentrating\">Concentrating\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#hidden\" data-pop=\"condition:hidden\">Hidden\u003c/a>, or \u003ca class=\"tag\" href=\"conditions.html#injured\" data-pop=\"condition:injured\">Injured\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Class:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#thief\" data-pop=\"class:thief\">Thief\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/dirty-trick.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"D\">\u003cdiv>\u003cp>\u003cstrong>Dirty Trick.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 2 · Finisher — 2 Combo\u003c/span> When you hit a creature, you can throw sand in its eyes or sweep its legs. The creature must make an Agility Test against a Difficulty of 10 + your Agility. On a failure, it becomes \u003ca class=\"tag\" href=\"conditions.html#blinded\" data-pop=\"condition:blinded\">Blinded\u003c/a> until the end of its next Turn or falls \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a> (your choice).\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/kick-them-while-theyre-down.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"K\">\u003cdiv>\u003cp>\u003cstrong>Kick Them While They're Down.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 5\u003c/span> Add your Agility to the damage of your attacks against hindered creatures.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/low-blow.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"L\">\u003cdiv>\u003cp>\u003cstrong>Low Blow.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 8\u003c/span> When you hit a hindered creature, you gain 1 additional Combo.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/no-honor-among-thieves.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"N\">\u003cdiv>\u003cp>\u003cstrong>No Honor Among Thieves.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 11\u003c/span> Once per combat, when a creature within your Melee Reach attacks one of your allies, you can use your Reaction to make an attack against it. If you hit, you can use Dirty Trick without spending Combo.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#specialization-street-scoundrel"}},{"id":"defender","nome":"Defender","fonte":"FTC","icone":"specializations/defender.svg","tipo":"Warrior Specialization","campos":{"class":"Warrior"},"html":"\u003cp>Defenders specialize in protecting their allies and taking damage in their place. They plant themselves at the front of the line, draw the enemy&#39;s attention, and refuse to fall while anyone behind them still needs protecting.\u003c/p>\n\u003cp>\u003cstrong>Class:\u003c/strong> \u003ca class=\"tag\" href=\"classes.html#warrior\" data-pop=\"class:warrior\">Warrior\u003c/a>\u003c/p>\n\u003ch3>Features\u003c/h3>\u003cul class=\"tracos\">\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/guardian.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"G\">\u003cdiv>\u003cp>\u003cstrong>Guardian.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 2\u003c/span> When a creature within 1 Zone of you is hit by an attack, you can use your Reaction to take the hit instead. You become the target of the attack, and it hits you.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/taunt.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"T\">\u003cdiv>\u003cp>\u003cstrong>Taunt.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 5\u003c/span> As a Minor Action, you challenge a creature within 6 Zones of you. Until the end of its next Turn, it has Disadvantage on attacks against creatures other than you. You can use this feature 1 &gt; 2 &gt; 3 times per combat.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/bulwark.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"B\">\u003cdiv>\u003cp>\u003cstrong>Bulwark.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 8\u003c/span> Allies within 1 Zone of you gain +1 Defense.\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cimg class=\"icone mini\" src=\"@img/specializations/features/last-stand.svg\" alt=\"\" width=\"512\" height=\"512\" data-inicial=\"L\">\u003cdiv>\u003cp>\u003cstrong>Last Stand.\u003c/strong> \u003cspan class=\"traco-nivel\">Level 11\u003c/span> Once per Recover, when you drop to 0 Life, you drop to 1 Life instead, and you gain Resistance to all damage until the end of your next Turn.\u003c/p>\u003c/div>\u003c/li>\u003c/ul>","origem":{"titulo":"Fragments Of The Cosmos","url":"livros/fragments-of-the-cosmos.html#specialization-defender"}}],"retrato":false};</script>
