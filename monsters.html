ury by raw mana.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>11 &gt; 12 &gt; 13 &gt; 14\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>INT\u003c/strong> -2 · \u003cstrong>SPI\u003c/strong> +0 · \u003cstrong>CHA\u003c/strong> -1\u003c/p>\n\u003cp>\u003cstrong>Condition Immunities:\u003c/strong> \u003ca class=\"tag\" href=\"conditions.html#burned\" data-pop=\"condition:burned\">Burned\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#chilled\" data-pop=\"condition:chilled\">Chilled\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#deprived\" data-pop=\"condition:deprived\">Deprived\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#prone\" data-pop=\"condition:prone\">Prone\u003c/a>, \u003ca class=\"tag\" href=\"conditions.html#restrained\" data-pop=\"condition:restrained\">Restrained\u003c/a>\u003c/p>\n\u003ch3 id=\"traits\">Traits\u003c/h3>\n\u003cp>\u003cstrong>Element.\u003c/strong> Choose its element: \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a>, \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a>, or \u003ca class=\"tag\" href=\"damage-types.html#lightning\" data-pop=\"damage:lightning\">Lightning\u003c/a>. It has Immunity to that damage type. A Heat elemental has Vulnerability to \u003ca class=\"tag\" href=\"damage-types.html#freeze\" data-pop=\"damage:freeze\">Freeze\u003c/a>, and a Freeze elemental has Vulnerability to \u003ca class=\"tag\" href=\"damage-types.html#heat\" data-pop=\"damage:heat\">Heat\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>\u0 strong>Longsword.\u003c/strong> Melee attack \u003cspan class=\"esc-atk\" data-a=\"STR\">(Strength)\u003c/span>, reach 1 Zone. \u003cspan class=\"esc-dmg\" data-c=\"Medium\">Medium (d6 &gt; d8 &gt; d10 &gt; d12)\u003c/span> \u003ca class=\"tag\" href=\"damage-types.html#cut\" data-pop=\"damage:cut\">Cut\u003c/a> damage.\u003c/p>\n\u003ch3 id=\"reactions\">Reactions\u003c/h3>\n\u003cp>\u003cstrong>Protect.\u003c/strong> When an ally adjacent to it is hit by an attack, it can halve that damage and take the other half itself.\u003c/p>\n","origem":{"titulo":"Rupture Of The Cosmos","url":"livros/rupture-of-the-cosmos.html#soldier"},"escala":{"level":3,"role":"Standard","life":"Weak","def":13,"attrs":{"STR":["scale",2],"DEX":["scale",1],"AGI":["scale",1],"INT":["fixed",0],"SPI":["fixed",0],"CHA":["fixed",0]},"ataques":[["STR","Medium"]],"res":0,"extra":0}},{"id":"star-eater","nome":"Star Eater","fonte":"ROC","icone":"monsters/star-eater.webp","tipo":"Colossal Aberration · Suggested: Level 11 Boss","campos":{"type":"Aberration","role":"Boss","level":"11","size":"Colossal","life":"Medium"},"html":"\u003cp>A colossal beast of starlight, crowned with plumes that move like tendrils, that devours light and magic: the herald of the cosmos breaking apart.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Life\u003c/th>\n\u003cth>Defense\u003c/th>\n\u003cth>Speed\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cspan class=\"esc-vida\">Medium\u003c/span>\u003c/td>\n\u003ctd>10 &gt; 11 &gt; 12 &gt; 13\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>STR\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>DEX\u003c/strong> +0 · \u003cstrong>AGI\u003c/strong> +1 · \u003cstrong>INT\u003c/strong> +1 &gt; +2 &gt; +3 &gt; +4 · \u003cstrong>SPI\u003c/strong> +2 &gt; +3 &gt; +4 &gt; +5 · \u003cstrong>CHA\u003c/strong> +2\u003c/p>\n\u003cp>\u003cstrong>Senses:\u003c/strong> \u003ca class=\"tag\" href=\"livros
